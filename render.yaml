services:
  - type: web
    name: champion-pigeon-api
    env: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install --production=false && npx prisma generate && cd server && npm install --production=false && npm run build
    startCommand: cd server && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: champion-pigeon-db
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PORT
        value: 10000

  - type: web
    name: champion-pigeon-web
    env: static
    rootDir: .
    buildCommand: npm install && npm run build:client
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://champion-pigeon-api.onrender.com/api
      - key: VITE_WS_URL
        value: https://champion-pigeon-api.onrender.com
      - key: VITE_SITE_URL
        value: https://palkamtm.pl
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"

databases:
  - name: champion-pigeon-db
    databaseName: champion_pigeon
    user: champion_pigeon
    plan: free
    region: oregon
    ipAllowList: [] # Allow all IPs for simplicity, or restrict if needed
