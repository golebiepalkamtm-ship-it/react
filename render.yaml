services:
  - type: web
    name: champion-pigeon-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    buildFilter:
      ignoredPaths: []
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    envVars:
      - key: VITE_API_URL
        value: https://champion-pigeon-api.onrender.com/api
      - key: VITE_WS_URL
        value: https://champion-pigeon-api.onrender.com
      - key: VITE_SITE_URL
        value: https://www.palkamtm.pl
      - key: VITE_SUPABASE_URL
        value: https://nctvwxiqzbedgcmetyal.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false

    routes:
      - type: redirect
        source: /api/(.*)
        destination: https://champion-pigeon-api.onrender.com/api/$1

  - type: web
    name: champion-pigeon-api
    runtime: node
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://nctvwxiqzbedgcmetyal.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLIENT_URL
        value: https://www.palkamtm.pl
      - key: JWT_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_API_KEY
        sync: false
      - key: TWILIO_API_SECRET
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: SUPABASE_BUCKET
        value: auction-images
      - key: SUPABASE_BUCKET_PUBLIC
        value: auction-public
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false