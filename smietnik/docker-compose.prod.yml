services:
  redis:
    image: redis:7-alpine
    container_name: auction-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./server
      dockerfile: ../docker/api.Dockerfile
    container_name: auction-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=8001
    depends_on:
      - redis
    # Port 8001 is internal if web container proxies it, 
    # but we can expose it if needed for direct access or testing
    ports:
      - "8001:8001"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: auction-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    env_file:
      - .env

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.78.0
    container_name: otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317" # gRPC OTLP
      - "4318:4318" # HTTP OTLP
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    command: ["--config", "/etc/otel-collector-config.yaml"]

volumes:
  redis_data:
