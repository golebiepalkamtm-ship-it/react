[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets for 1 year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://vercel.live https://nctvwxiqzbedgcmetyal.supabase.co https://*.supabase.co https://*.supabase.in https://accounts.google.com https://www.google.com https://www.gstatic.com https://js.stripe.com https://m.stripe.network https://api.stripe.com https://r.stripe.com https://q.stripe.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://vercel.live ws://localhost:8001 https://nctvwxiqzbedgcmetyal.supabase.co https://*.supabase.co https://*.supabase.in wss://nctvwxiqzbedgcmetyal.supabase.co wss://*.supabase.co wss://*.supabase.in https://server-production-0e43.up.railway.app https://www.server-production-0e43.up.railway.app wss://server-production-0e43.up.railway.app wss://www.server-production-0e43.up.railway.app ws://server-production-0e43.up.railway.app ws://www.server-production-0e43.up.railway.app https://api.stripe.com https://m.stripe.network https://r.stripe.com https://q.stripe.com https://accounts.google.com https://www.google.com https://www.gstatic.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src 'self' https://vercel.live https://www.google.com https://www.youtube.com https://www.youtube-nocookie.com https://maps.google.com https://accounts.google.com https://js.stripe.com https://checkout.stripe.com; font-src 'self' data: https: https://fonts.googleapis.com https://fonts.gstatic.com; media-src 'self' data: blob:; object-src 'none'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Do not cache HTML files
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
