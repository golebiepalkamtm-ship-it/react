name: CI / Build & (optional) Deploy
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & build
        run: |
          npm ci
          npm run build
      - name: Run tests
        run: npm test --workspaces --if-present

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway (if configured)
        run: |
          if [ -n "$RAILWAY_API_KEY" ] && [ -n "$RAILWAY_PROJECT_ID" ]; then
            npm install -g @railway/cli
            echo "Railway deploy configured — triggering via CLI"
            railway up --detach --project "$RAILWAY_PROJECT_ID"
          else
            echo "Skipping Railway deploy (no credentials in env)"
          fi
        env:
          RAILWAY_API_KEY: ${{ secrets.RAILWAY_API_KEY }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

      - name: Deploy to Vercel (if configured)
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            npm install -g vercel
            vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
            vercel deploy --production --token "$VERCEL_TOKEN"
          else
            echo "Skipping Vercel deploy (no credentials in env)"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
