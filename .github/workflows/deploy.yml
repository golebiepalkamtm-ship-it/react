name: CI / Build & (optional) Deploy
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          # package.json "engines" requires Node >= 24
          node-version: '24'
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server
      - name: Generate Prisma client
        # .npmrc sets ignore-scripts, so the client is not generated during install.
        # Generating needs no database; the URL only satisfies prisma.config.ts.
        run: npm --prefix server run prisma:generate
        env:
          DATABASE_URL: postgresql://localhost:5432/ci
      - name: Typecheck (server)
        run: npm --prefix server run type-check
      - name: Lint
        run: npm run lint
      - name: Test
        # Runs the frontend and server suites once; reads .env.test (no real services).
        run: npx vitest run
      - name: Build
        run: npm run build

  deploy:
    needs: build
    # Opt-in. This job applies database migrations to production and deploys both
    # apps. Until now it never ran, because the build job always failed at its
    # test step ("npm test --workspaces" in a repository without workspaces).
    # Now that the build job can pass, deploying from Actions has to be switched
    # on deliberately: set the repository variable ENABLE_ACTIONS_DEPLOY to "true"
    # (Settings → Secrets and variables → Actions → Variables).
    if: ${{ vars.ENABLE_ACTIONS_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Deploy to Railway (if configured)
        run: |
          if [ -n "$RAILWAY_API_KEY" ] && [ -n "$RAILWAY_PROJECT_ID" ]; then
            npm install -g @railway/cli
            echo "Railway deploy configured — triggering via CLI"
            railway up --detach --project "$RAILWAY_PROJECT_ID"
          else
            echo "Skipping Railway deploy (no credentials in env)"
          fi
        env:
          RAILWAY_API_KEY: ${{ secrets.RAILWAY_API_KEY }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

      - name: Deploy to Vercel (if configured)
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            npm install -g vercel
            vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
            vercel deploy --production --token "$VERCEL_TOKEN"
          else
            echo "Skipping Vercel deploy (no credentials in env)"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
