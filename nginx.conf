server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content Security Policy aligned with server/middleware/csp.ts
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://nctvwxiqzbedgcmetyal.supabase.co https://*.supabase.co https://*.supabase.in https://accounts.google.com https://www.google.com https://www.gstatic.com https://js.stripe.com https://m.stripe.network https://api.stripe.com https://r.stripe.com https://q.stripe.com; script-src-elem 'self' https://nctvwxiqzbedgcmetyal.supabase.co https://*.supabase.co https://*.supabase.in https://accounts.google.com https://www.google.com https://www.gstatic.com https://js.stripe.com https://m.stripe.network https://api.stripe.com https://r.stripe.com https://q.stripe.com; worker-src 'self' blob: data: https://nctvwxiqzbedgcmetyal.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://nctvwxiqzbedgcmetyal.supabase.co https://*.supabase.co https://*.supabase.in https://server-production-0e43.up.railway.app https://api.stripe.com https://m.stripe.network https://r.stripe.com https://q.stripe.com https://accounts.google.com https://www.google.com https://www.gstatic.com https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data: https: blob: https://nctvwxiqzbedgcmetyal.supabase.co; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://maps.google.com https://accounts.google.com https://js.stripe.com https://checkout.stripe.com; font-src 'self' data: https: https://fonts.googleapis.com https://fonts.gstatic.com; media-src 'self' data: blob: https://nctvwxiqzbedgcmetyal.supabase.co; object-src 'none'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Cache Control for HTML (no-cache to ensure updates are seen)
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Static Assets Caching (Long cache for hashed assets)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Proxy API requests to the backend
    location /api {
        proxy_pass http://api:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Don't cache API responses by default (let backend decide)
        proxy_set_header Cache-Control "no-cache";
    }

    # Proxy WebSocket connections
    location /socket.io {
        proxy_pass http://api:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
