version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: champion_pigeon_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: champion_pigeon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: champion_frontend
    ports:
      - "8081:8081"
    environment:
      - VITE_API_URL=http://localhost:8001/api
      - VITE_SITE_URL=http://localhost:8081
      - VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jdHZ3eGlxemJlZGdjbWV0eWFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY0Nzk2NDUsImV4cCI6MjA4MjA1NTY0NX0.A3ie8bcvSZeXclTKgMyh5L3uz_LPTjlHz95isEQ3kJQ
      - VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_5PhjleD4r27I7pK531AOBg_6MywaGyL
      - VITE_SUPABASE_URL=https://nctvwxiqzbedgcmetyal.supabase.co
      - VITE_WS_URL=ws://localhost:8001
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    depends_on:
      - backend

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.backend
    container_name: champion_backend
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/champion_pigeon?schema=public
      - JWT_SECRET=your_strong_secret_here
      - SUPABASE_URL=https://nctvwxiqzbedgcmetyal.supabase.co
      - SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jdHZ3eGlxemJlZGdjbWV0eWFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY0Nzk2NDUsImV4cCI6MjA4MjA1NTY0NX0.A3ie8bcvSZeXclTKgMyh5L3uz_LPTjlHz95isEQ3kJQ
      - SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jdHZ3eGlxemJlZGdjbWV0eWFsIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2NjQ3OTY0NSwiZXhwIjoyMDgyMDU1NjQ1fQ.3Xcx9TZ5fuWPsp0leEaHNxra64Zs4cV4r8zy3HoFl0A
      - CLIENT_URL=http://localhost:8081
      - NODE_ENV=development
      - PORT=8001
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_VERIFY_SERVICE_SID=${TWILIO_VERIFY_SERVICE_SID}
    volumes:
      - ./server:/app
    depends_on:
      - postgres

volumes:
  pgdata:
