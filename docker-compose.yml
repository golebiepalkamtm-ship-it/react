services:
  api:
    container_name: auction-api
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env.api
    ports:
      - "8001:8001"
    restart: unless-stopped

  web:
    container_name: auction-web
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file:
      - .env.web
    ports:
      - "4173:80"
    depends_on:
      - api
    restart: unless-stopped
